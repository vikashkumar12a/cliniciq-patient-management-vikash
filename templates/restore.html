<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restore Database - ClinicIQ</title>
</head>
<body>

    <h1>ClinicIQ - Database Restore</h1>

    <p>Select a backup file to restore your database.</p>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if success %}
        <p style="color: green;">{{ success }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('restore_database') }}"
          onsubmit="return confirm('Are you sure? Current database will be replaced.');">

        <label for="backup_file">Select Backup:</label>

        <select name="backup_file" id="backup_file" required>
            <option value="">-- Select Backup File --</option>

            {% for backup in backups %}
                <option value="{{ backup }}">{{ backup }}</option>
            {% endfor %}

        </select>

        <br><br>

        <button type="submit">Restore Database</button>

    </form>

    <br>

    <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>

</body>
</html>
